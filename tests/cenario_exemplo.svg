<?xml version="1.0" encoding="UTF-8"?>
<!-- 1 user unit = 1 km. Page = model domain (1600 x 300 km). -->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="1600mm" height="300mm" viewBox="0 0 1600 300">
  <g inkscape:groupmode="layer" inkscape:label="litologias">
    <rect id="asthenosphere" x="0" y="0" width="1600" height="300" style="fill:#cfe2cd;stroke:none"/>
    <rect id="lithospheric_mantle" x="0" y="0" width="1600" height="195" style="fill:#9bc29b;stroke:none"/>
    <rect id="lower_crust" x="0" y="0" width="1600" height="75" style="fill:#f0d1bc;stroke:none"/>
    <rect id="upper_crust" x="0" y="0" width="1600" height="65" style="fill:#e49c7c;stroke:none"/>
    <rect id="air" x="0" y="0" width="1600" height="40" style="fill:#ffffff;stroke:none"/>
    <rect id="seed" x="797" y="69" width="6" height="6" style="fill:#000000;stroke:none"/>
  </g>
  <g inkscape:groupmode="layer" inkscape:label="anotacoes">
    <text x="800" y="60" style="font-size:8px">weak seed</text>
  </g>
</svg>
